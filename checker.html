<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"> 
    <style>
            body {
            background: linear-gradient(135deg, #183e2c, #263a50);
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            }

            .main-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(41, 95, 111, 0.2);
            }
            .header {
            background: #20453e;
            color: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
<center>
    <br>
<div class="container">
    <div class="card main-card">
        <div class="header">
            <br>
            <h3>Element Checker</h3>
            <p>Input an element's symbol (ex: Au, O, C) to get its information and details</p>
        </div>

        <div class="card-body p-4">
            <input placeholder="enter chemical symbol">
            <br>
            <br>
            <button class="btn btn-success w-100 mb-1">Get Result</button>
                    <p class="mt-3 fw-bold" id="result"></p>
        </div>    
    </div>
</div>
</center>

</body>
</html>
